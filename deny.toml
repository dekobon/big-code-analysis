# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# `big-code-analysis` itself is licensed under MPL-2.0, and several of
# its first-party crates re-license under MPL-2.0, so MPL-2.0 must be
# accepted for the dependency graph to resolve.
#
# One config, eight graphs. `utils/check-deny-manifests.sh` runs cargo-deny
# against every tracked `Cargo.lock` — the root workspace plus the seven
# `[workspace].exclude` crates (`enums`, `fuzz`, the five `tree-sitter-*`),
# each of which resolves its own — and passes this file to each by
# `--config` (#1823). An entry below therefore applies to all eight.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Keyed by advisory id, not by lockfile: one entry silences that advisory in
# all eight graphs, including ones it was never reported against. Say in its
# `reason` which graph needed it.
ignore = []
# The default scope ("workspace") reports an unsound advisory only for a
# direct dependency, so RUSTSEC-2026-0306 in `faster-hex` (reached through
# gix-hash) passed this gate for weeks and surfaced only via the Scorecard
# Vulnerabilities check. Unsound code anywhere in the graph ships in `bca`.
unsound = "all"

[licenses]
version = 2
# Permissive licenses compatible with Apache-2.0 OR MIT distribution,
# plus MPL-2.0 for this project's own crates.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
# `libfuzzer-sys` vendors LLVM's libFuzzer, whose NCSA licence is ANDed onto
# the crate's own `MIT OR Apache-2.0`. NCSA is permissive (BSD-style), and
# the crate sits only in the unpublished `fuzz` graph, so an exception scoped
# to it beats a global allow that any future crate could ride. The seven
# graphs without `fuzz` warn `license-exception-not-encountered`; expected.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `fuzz` takes `big-code-analysis` by path with no version, deliberately (see
# `fuzz/Cargo.toml`), and cargo-deny reads that as a wildcard. This exempts a
# path or git dependency only in a `publish = false` crate, plus path or git
# dev-deps, which crates.io strips; a published crate's still needs a version.
# A git source must also pass `[sources]` below, which denies unknown ones.
allow-wildcard-paths = true
# No `deny` entry for `h2 <0.4.16` (RUSTSEC-2026-0258): cargo-deny's graph
# builder drops that crate before any check runs (`-L debug` logs
# `filtered h2 0.3.27` with `actix-web/http2` enabled, on 0.19 and 0.20),
# so neither an advisory nor a ban can see it. The lockfile is pinned by
# `lockfile_tests` in big-code-analysis-web instead.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
