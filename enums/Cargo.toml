# Standalone workspace root. The root manifest `exclude`s this crate, but
# `exclude` denies membership without terminating cargo's upward search for a
# workspace root. Inside a git worktree under `.claude/worktrees/` that search
# escapes the worktree and lands on the main checkout's manifest, where this
# path is neither a member nor excluded — breaking `cargo fmt --all` and every
# `make pre-commit` stage that depends on it (#1145).
#
# Kept at the top of the file rather than the bottom: an empty table as the
# last thing in a manifest silently adopts any bare key appended after it, so
# a future `foo = "1"` meant for `[package]` would become `[workspace].foo`.
[workspace]

[package]
name = "enums"
version = "2.2.0"
publish = false
authors = ["Calixte Denizet <cdenizet@mozilla.com>"]
edition = "2024"

[dependencies]
clap = { version = "^4.0", features = ["derive"] }
askama = "^0.16"

# NOTE: enums/ is excluded from the workspace (see ../Cargo.toml
# [workspace].exclude), so these pins cannot inherit from
# [workspace.dependencies]. They MUST be kept in lockstep with the
# matching block in ../Cargo.toml when grammars are bumped
# (see recreate-grammars.sh).
tree-sitter = "=0.26.12"
tree-sitter-bash = "=0.25.1"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-elixir = "=0.3.5"
tree-sitter-go = "=0.25.0"
dekobon-tree-sitter-groovy = "=0.2.2"
tree-sitter-irules = "=0.1.1"
tree-sitter-java = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-lua = "=0.5.0"
tree-sitter-objc = "=3.0.2"
tree-sitter-perl = "=1.1.2"
tree-sitter-php = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-ruby = "=0.23.1"
tree-sitter-rust = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c = "=0.24.2"
# Vendored grammar forks — see ../Cargo.toml for rationale on the
# `package = ...` alias trick that preserves the `tree_sitter_<lang>`
# import path while the published crate name is `bca-tree-sitter-<lang>`.
tree-sitter-tcl = { package = "bca-tree-sitter-tcl", path = "../tree-sitter-tcl", version = "=2.2.0" }
tree-sitter-preproc = { package = "bca-tree-sitter-preproc", path = "../tree-sitter-preproc", version = "=2.2.0" }
tree-sitter-ccomment = { package = "bca-tree-sitter-ccomment", path = "../tree-sitter-ccomment", version = "=2.2.0" }
tree-sitter-mozcpp = { package = "bca-tree-sitter-mozcpp", path = "../tree-sitter-mozcpp", version = "=2.2.0" }
tree-sitter-mozjs = { package = "bca-tree-sitter-mozjs", path = "../tree-sitter-mozjs", version = "=2.2.0" }

# Mirrors [workspace.lints] in ../Cargo.toml. `enums` is excluded from
# that workspace (see [workspace].exclude there), so it cannot inherit
# via `lints.workspace = true` and needs its own copy — without it
# `make enums-check` reads as a full lint gate while running against a
# strictly smaller lint set than every shipping crate (#1228).
#
# One deliberate divergence: the workspace's
# `unexpected_cfgs = { check-cfg = ['cfg(chain_audit)'] }` entry is not
# repeated here. It exists to *admit* the library's `chain_audit` walk
# assertion (#1122), which this crate has no counterpart to; copying it
# would only teach rustc to accept a `cfg(chain_audit)` typo in a crate
# that never sets the flag.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

# `clippy::unwrap_used` is a per-root `#![cfg_attr(not(test), ...)]`
# attribute in src/lib.rs and src/main.rs rather than an entry here, for
# the reason spelled out in ../Cargo.toml: a Cargo lint applies to every
# target of its package, and the `unwrap` ban is a production-only rule
# (#1227).

[profile.release]
debug = "line-tables-only"
