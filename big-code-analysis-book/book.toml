[book]
title = "big-code-analysis Documentation"
description = "This book documents big-code-analysis"
authors = [
  "Calixte Denizet <cdenizet@mozilla.com>",
  "Elijah Zupancic <elijah@zupancic.name>",
]
language = "en"

[build]
extra-watch-dirs = ["po"]

# Gettext-based translation pipeline (mdbook-i18n-helpers). English
# builds pass through untouched; setting MDBOOK_BOOK__LANGUAGE=ja
# makes this preprocessor substitute translations from po/ja.po,
# falling back to English for untranslated or fuzzy entries.
# `optional = true` keeps plain `mdbook build` working for
# contributors without mdbook-gettext installed.
[preprocessor.gettext]
after = ["links"]
optional = true

[output.html]
mathjax-support = true

[output.html.playpen]
line-numbers = true

[output.html.search]
limit-results = 25
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3
