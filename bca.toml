# bca.toml — repo-level manifest, auto-discovered by `bca` (and by
# `make self-scan`) when climbing from the working directory to the
# repo root. This is the single source of truth for the project's own
# self-scan gate: a bare `bca check` (no flags) reproduces the full
# hard-tier gate. The soft tier and baseline-refresh recipes add only
# the one flag each that distinguishes them.
#
# CI consumes this the same way: `make self-scan` runs `bca check`
# with no path / threshold / baseline flags, since they all live here.
# We build the bca binary from source on purpose so any in-progress
# change to metric computation is reflected in the values we gate on.

# Scan the whole repo, honouring the ignore file. The walker re-anchors
# the resolved seed to the `./`-prefixed form (#488), so the
# `./`-anchored `.bcaignore` deny-set matches identically whether the
# root came from this manifest, `--paths .`, or `--paths "$PWD"`.
paths = ["."]
exclude_from = ".bcaignore"

# Treat Rust's `?` (the `try_expression` node) as linear error
# propagation rather than a branch: it does not contribute to
# cyclomatic complexity (standard or modified). Equivalent to passing
# `--cyclomatic-count-try=false` (#409/#666). Rust-only — no other
# grammar emits the node, so the key is inert elsewhere.
cyclomatic_count_try = false

# Prune Rust inline-test subtrees (`#[test]`, `#[cfg(test)]`,
# `#[tokio::test]`, `#[rstest]`, `#![cfg(test)]`) before any metric is
# computed, so the gate measures production code rather than the large
# `#[cfg(test)]` modules this project co-locates in-file (#182/#717).
# Equivalent to passing `--exclude-tests`. Rust-only — inert for other
# grammars. Lowers the node-counted metrics (cyclomatic, cognitive,
# halstead.*, nom, nargs, abc, wmc) and, since #722, `loc.sloc` as
# well: the file root span is still the raw first-to-last line range,
# but each pruned subtree's inclusive row count is now subtracted from
# it. Only the pruned *node* comes off, so a gated item's
# `#[cfg(test)]` attribute line, its doc comment, and the blank lines
# around it still cost full price against the `loc.sloc` cap below —
# budget accordingly when adding shared test helpers to a production
# file (#1066), or put them in an ignored test-only module instead.
exclude_tests = true

# Gate-only options consumed by `bca check` (#599). The baseline pairs
# with `.bca-baseline.toml` so existing offenders are absorbed; only
# regressions and new offenders fail the gate. See the Baselines recipe
# in the book for the bootstrap/refresh/retire flow.
[check]
baseline = ".bca-baseline.toml"

# Dev tooling this repo authors but does not ship. These are analysed —
# they show up in `bca report`, and `bca metrics` measures them like any
# other source — but they never gate. That distinction is the whole
# reason they live here rather than in `.bcaignore` (#1146): a walker
# exclude shapes what gets *analysed* and is overridden by an
# explicitly-named path, so the per-file agent hooks in `.claude/hooks/`
# and `.opencode/plugins/` bypassed it and reported offenders in files
# `make self-scan` correctly ignores. A `[check] exclude` glob survives
# an explicit path, which is what "never gate this" has to mean.
#
# The exempted code is real, and some of it is genuinely complex: the
# `utils/` gate scripts are argument-parsing `main`s, `enums/`'s
# `sanitize_identifier` is a character-class table, and the benchmark
# harness's formatters are long runs of `writeln!(...)?` whose `nexits`
# says nothing about maintainability. None of it ships to a user.
exclude = [
  "./.claude/**",
  "./.opencode/**",
  "./big-code-analysis-bench/**",
  "./enums/**",
  "./generate-grammars/**",
  "./utils/**",
  "./xtask/**",
]

# bca metric threshold configuration.
#
# These limits are this repository's own calibration and are expected to
# differ from the defaults `bca init` scaffolds (which live in
# `big-code-analysis-cli/src/default_thresholds.rs` and are derived in
# the book's `Choosing thresholds` recipe). Until #1140 a drift test
# forced the two equal, which meant this project's Rust-specific
# calibration was also what every adopter got on day one. Where this
# file diverges, the divergence is noted inline with its reason.
#
# Editing rules:
#   * Each key is a stable metric name (or dotted sub-metric name) from
#     `bca list-metrics` / `bca check --help`. Available names:
#         cognitive, cyclomatic, cyclomatic.modified,
#         halstead.volume, halstead.difficulty, halstead.effort,
#         halstead.time, halstead.bugs,
#         loc.sloc, loc.ploc, loc.lloc, loc.cloc, loc.blank,
#         nom, tokens, nexits, nargs,
#         mi.original, mi.sei, mi.visual_studio,
#         abc, wmc, npm, npa
#   * Quote keys containing a dot (TOML requires it).
#   * Each limit is checked against the space kind the metric actually
#     measures (#969): the complexity and per-function metrics
#     (cognitive, cyclomatic, halstead.*, mi.*, abc, nargs, nexits,
#     tokens) gate individual functions; the OO size metrics (nom, wmc,
#     npm, npa) gate container spaces (impl / struct / trait / ...); and
#     loc.* gates the whole-file root. A metric's file-wide or impl-wide
#     aggregate is therefore never mistaken for a per-function limit, so
#     whole-file `suppress-file` markers are no longer needed to mute it.
#     A space whose metric exceeds the limit becomes an offender; the
#     baseline file decides whether it fails CI.
#   * Adding a metric is a tightening — regenerate `.bca-baseline.toml`
#     in the same change so day-one CI does not flip red on offenders
#     that were previously invisible to the gate.
#
# Metrics intentionally NOT gated (yet):
#         cyclomatic.modified,
#         halstead.volume, halstead.difficulty, halstead.time,
#         halstead.bugs,
#         loc.lloc, loc.cloc, loc.blank,
#         mi.original, mi.sei, mi.visual_studio,
#         npm, npa, tokens
# Their distributions on this codebase are dominated by macro-expanded
# language modules; gating them would either require thresholds high
# enough to be meaningless, or fire on the long tail of dispatch arms.
# They are still computed and visible in `bca report markdown|html`.
[thresholds]
# `cognitive` and `abc` have converged onto the shipped defaults (15 and
# 40). `cognitive` 25 -> 15 landed in #1143: 25 was the pre-#1140
# folklore value and, at a measured maximum of 20, gated nothing at all.
# 15 is also this repo's own 97.5th percentile — the same statistic
# #1140 derived the shipped default from — so the two agree by
# derivation, not by coincidence.
#
# The convergence cost 18 hard-tier offenders: 10 were genuinely
# simplified and 8 carry a `bca: suppress(cognitive)` marker (per-language
# grammar dispatch and byte-level scanners). The 16 functions sitting at
# exactly 15 are the soft tier's own cost — a limit placed on a population
# value puts everything at that value inside the 0.95 band by construction
# — and 14 of them are baselined rather than marked: a function at the
# limit is not over it, and a baseline entry keeps the growth alarm a
# suppression marker would discard.
#
# `nargs` is at the shipped default of 5, converged from 7 (#1183).
#
# The convergence was declined twice before, and both refusals were
# right at the time. #1143 measured 7 -> 6 as a free ratchet on a
# hard-tier count and missed that the proportional soft tier would park
# 74 functions permanently in the band. #1183 then measured 6 -> 5 and
# found the offenders were mostly not parameter-heavy at all: the gate
# summed a function's own parameters with every nested closure's, so 59
# of 76 would-be offenders were artifacts and one had a single parameter
# plus five from closures in its body.
#
# #1196 fixed that — the gate now counts a callable's own parameters,
# which is what RuboCop, ESLint, Clippy, lizard, SonarQube and Pylint all
# measure, and what this limit's own rationale in
# `default_thresholds.rs` was derived from. That removed the reason to
# stay at 7, and staying would have left a limit that caught nothing in
# the current tree: at 7 there were 6 offenders and all 6 were already
# baselined, which is the same "cannot catch anything" the book uses to
# argue the shipped default off 7.
#
# The remaining cost is the soft tier, and it is worth naming precisely.
# For an integer metric, a function sitting *exactly* at the limit is
# always above `0.95 x limit`, so it is always in the soft band — that is
# structural, not specific to 5, and it is true of the functions at
# exactly 7 today. What changes with the limit is only how many sit
# there: 91 at 5 against 10 at 7. That is the real content of #1143's
# "cluster" objection, and it is an argument about the soft tier's fit
# for small-integer metrics rather than about this number.
cognitive = 15
cyclomatic = 15
"halstead.effort" = 50000
# File size is gated in two tiers (#1138, #1140). Both are File-scoped
# (#969): they gate the whole-file root, never each function — an
# oversized function trips cognitive / cyclomatic / abc long before it
# nears any of these line counts.
#
# `loc.ploc` is the working limit: physical lines of code, blanks and
# comments excluded. 550 sits just above this repo's p99 (545) with the
# current distribution at p50 68 / p90 331 / p95 421. That is stricter
# than the shipped default of 600 on purpose — a house style that asks
# for a why-comment whenever the reasoning is non-obvious should be
# measured on its code, and then held to a tighter bound on it.
"loc.ploc" = 550
# `loc.sloc` is a bloat backstop, not the working limit: it counts
# comments and blanks, so its only job is to stop a file growing without
# bound on comment volume alone while still clearing loc.ploc. 1300
# leaves real headroom over today's largest file (1080) and over the
# 0.95 soft tier, so ordinary documentation growth never trips it.
#
# This replaces the previous single `loc.sloc = 800` gate, whose stated
# derivation ("Rust co-locates #[cfg(test)] tests in-file, so file SLOC
# runs 2-3x...") stopped holding when `exclude_tests = true` landed
# twelve days after the limit was set, and which in practice charged the
# same price for documenting a decision as for adding code — #1138 found
# seven files clustered in a four-line band ending exactly on the soft
# limit, which is trimming-to-fit rather than a natural distribution.
"loc.sloc" = 1300
nom = 30
nargs = 5
nexits = 5
abc = 40
wmc = 60
