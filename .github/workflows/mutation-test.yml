name: Mutation testing

# Quarterly run of cargo-mutants against the highest-leverage modules
# (metrics, checker, getter). Mutation testing is too slow to gate
# per-PR CI, so this workflow only runs on the cron schedule and on
# manual dispatch. See docs/development/mutation_testing.md for the
# rationale and local-invocation notes.

on:
  schedule:
    # 07:00 UTC on the 1st of January, April, July, October.
    - cron: '0 7 1 1,4,7,10 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mutation-test
  cancel-in-progress: false

# All `uses:` below are pinned to commit SHAs to eliminate supply-chain
# risk from action-release spoofing. Bump via Dependabot (see
# .github/dependabot.yml), which rewrites the SHA + version comment.
jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-latest
    # GitHub-hosted runners cancel a job at 6 hours whatever this says;
    # the earlier 720 was never in effect. A cancelled run step is not a
    # `failure()`, so the issue step below does not fire on timeout —
    # the serial in-place run over the full selection is expected to
    # need sharding to fit (#1726).
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable tip
        with:
          toolchain: stable

      - name: Cache cargo build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-mutants
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-mutants

      # The timeout floor, output directory and test-package set come
      # from `.cargo/mutants.toml`; only the flags that have no config
      # key are spelled here. `--in-place` conflicts with `--jobs`
      # (parallel mutants need separate tree copies), and copying the
      # corpus submodules per job is what in-place avoids, so there is
      # no `-j`. `pipefail` matters: without it the step reports
      # `tee`'s status and a cargo-mutants failure reads as success
      # (#1710 — the 2026-10-01 run passed after 68 seconds). A `-f`
      # glob containing `/` matches the whole path, so `src/metrics/`
      # selected nothing; `**/*.rs` reaches the per-language
      # subdirectories too.
      - name: Run cargo-mutants
        id: mutants
        run: |
          set -euo pipefail
          mkdir -p target/mutants
          cargo mutants \
            --package big-code-analysis \
            --package big-code-analysis-ast \
            --in-place \
            -f 'src/metrics/**/*.rs' \
            -f big-code-analysis-ast/src/checker.rs \
            -f big-code-analysis-ast/src/getter.rs \
            | tee target/mutants/mutants.log

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-mutants-report
          path: target/mutants/
          if-no-files-found: warn
          retention-days: 90

      - name: File issue on escaped mutants
        if: failure() && steps.mutants.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # cargo-mutants nests `mutants.out/` under the configured
          # `output` directory; the result files are never written
          # directly into `target/mutants/` (#1710).
          out=target/mutants/mutants.out
          missed_count=0
          if [ -f "$out/missed.txt" ]; then
            missed_count=$(wc -l < "$out/missed.txt" | tr -d ' ')
          fi
          timeout_count=0
          if [ -f "$out/timeout.txt" ]; then
            timeout_count=$(wc -l < "$out/timeout.txt" | tr -d ' ')
          fi
          if [ "$missed_count" = "0" ] && [ "$timeout_count" = "0" ]; then
            echo "cargo-mutants failed without producing missed/timeout output;"
            echo "treating as infrastructure failure, not opening an issue."
            exit 0
          fi
          {
            echo "The scheduled \`mutation-test.yml\` run reported escaped mutants."
            echo
            echo "- Missed mutants: ${missed_count}"
            echo "- Timed-out mutants: ${timeout_count}"
            echo "- Run: ${RUN_URL}"
            echo
            echo "Download the \`cargo-mutants-report\` artifact for the full"
            echo "list (\`mutants.out/missed.txt\`, \`mutants.out/timeout.txt\`)"
            echo "and the run's stdout (\`mutants.log\`)."
            echo
            echo "See \`docs/development/mutation_testing.md\` for triage guidance."
            if [ -f "$out/missed.txt" ] && [ "$missed_count" != "0" ]; then
              echo
              echo "## First 50 missed mutants"
              echo
              echo '```'
              head -n 50 "$out/missed.txt"
              echo '```'
            fi
          } > /tmp/mutation-issue-body.md
          gh issue create \
            --title "Mutation testing: ${missed_count} missed, ${timeout_count} timed out (run ${{ github.run_id }})" \
            --label "mutation-testing" \
            --label "enhancement" \
            --body-file /tmp/mutation-issue-body.md
