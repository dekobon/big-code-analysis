; checkmake configuration -- https://github.com/mrtazz/checkmake
;
; Run with: checkmake --config .checkmake.ini Makefile
;
; The default maxBodyLength of 5 is too aggressive for orchestration
; Makefiles that contain self-documenting help blocks and multi-step
; fmt/lint pipelines. The cap accommodates the self-documenting help
; target (which grows by one line per public target) plus compound
; pipelines while still flagging genuinely runaway recipes that
; should be split into helper scripts. Cap is held above the
; current `help` recipe body with at least 15 lines of headroom
; so adding a new public target doesn't force a cap bump.
;
; Raised from 100 to 120 in #1068: the `help` body had reached
; exactly 100, so the headroom this file promises was already spent
; and the next public target — any target, not just that one's —
; would have failed the gate. Adding the three `bench*` targets took
; it to 103.
;
; Raised from 120 to 140 in #1154 (2026-08-08), for the same reason
; one bump later: the three `fuzz-*` targets took the `help` body to
; 122, past a cap that had 18 lines of headroom left rather than the
; 15 this file promises. 140 restores it.

[maxbodylength]
maxBodyLength = 140
