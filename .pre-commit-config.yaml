repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-executables-have-shebangs
    -   id: check-merge-conflict
    -   id: check-symlinks
    -   id: check-yaml
    -   id: check-json
        exclude: enums/templates/json.json
-   repo: https://github.com/marco-c/taskcluster_yml_validator
    rev: v0.0.12
    hooks:
      - id: taskcluster_yml
-   repo: https://github.com/astral-sh/ruff-pre-commit
    # Bump in lockstep with the big-code-analysis-py/pyproject.toml
    # `ruff>=0.6,<0.16` floor. `ruff-check` and `ruff-format` are the
    # current hook IDs (the legacy `ruff` alias is deprecated).
    rev: v0.15.14
    hooks:
    -   id: ruff-check
        args: [--fix]
        files: ^big-code-analysis-py/.*\.py$
    -   id: ruff-format
        files: ^big-code-analysis-py/.*\.py$
-   repo: local
    hooks:
      # FIXME: Uncomment when fmt is fixed
      # - id: fmt
      #   name: fmt
      #   language: system
      #   files: '\.rs$'
      #   exclude: '.*/templates/.*\.rs$'
      #   entry: cargo fmt -- --check --verbose

      - id: clippy
        name: clippy
        language: system
        files: '\.rs$'
        entry: cargo clippy --all-targets --all -- -D warnings
        pass_filenames: false

      - id: udeps
        name: udeps
        language: system
        files: '\.rs$'
        entry: cargo +nightly udeps --all-targets
        pass_filenames: false

      - id: test
        name: test
        language: system
        files: '\.rs$'
        entry: cargo test
        pass_filenames: false

      # actionlint validates GitHub Actions workflow syntax and shells
      # out to shellcheck for `run:` blocks. `language: system` so the
      # contributor's PATH-resolved `actionlint` is used (the binary is
      # a single Go executable — see utils/check-tools.sh for install
      # hints). The hook only fires on workflow files under
      # `.github/workflows/` and on the actionlint config itself,
      # because `actionlint` with no args (matching the `make
      # actionlint` recipe) discovers exactly those — composite
      # actions in `.github/actions/*/action.yml` would be matched but
      # not actually checked, so listing them here would be misleading.
      # When composite actions are added, pass them to actionlint
      # explicitly rather than just widening this regex.
      - id: actionlint
        name: actionlint
        language: system
        files: '^\.github/(workflows/.*\.ya?ml|actionlint\.ya?ml)$'
        entry: actionlint -no-color
        pass_filenames: false

      - id: snapshot-anchors
        name: snapshot-anchors
        language: system
        files: '^(src/metrics/.*\.rs|\.snapshot-anchor-baseline\.txt|utils/check-snapshot-anchors\.py)$'
        entry: python3 utils/check-snapshot-anchors.py
        pass_filenames: false

      # Self-tests for the snapshot-anchors gate itself. Kept as a
      # separate hook so the gate hook above remains a one-line
      # invariant check, matching the rustfmt-bail pair below.
      - id: snapshot-anchors-test
        name: snapshot-anchors-test
        language: system
        files: '^utils/check-snapshot-anchors(-test)?\.py$'
        entry: python3 -m unittest -q utils/check-snapshot-anchors-test.py
        pass_filenames: false

      # Block new match arms rustfmt refuses to format (#1136). A
      # comment inside a match *pattern* makes rustfmt emit the whole
      # match verbatim while `cargo fmt --check` still exits 0, so the
      # `fmt` hook above cannot see any of this. The gate sweeps the
      # whole workspace rather than a directory list — the site list in
      # .claude/rules/formatting.md was scoped to src/metrics/ for two
      # revisions, which is exactly how the largest cluster
      # (src/getter/) went unnoticed — so the trigger is any Rust file.
      - id: rustfmt-bail
        name: rustfmt-bail
        language: system
        files: '^(.*\.rs|\.rustfmt-bail-baseline\.txt|utils/check-rustfmt-bail\.py)$'
        entry: python3 utils/check-rustfmt-bail.py
        pass_filenames: false

      # Self-tests for the rustfmt-bail gate itself. Kept as a separate
      # hook so the gate hook above remains a one-line invariant check.
      - id: rustfmt-bail-test
        name: rustfmt-bail-test
        language: system
        files: '^utils/check-rustfmt-bail(-test)?\.py$'
        entry: python3 -m unittest -q utils/check-rustfmt-bail-test.py
        pass_filenames: false

      # Block grammar-marker bumps in tree-sitter-{mozjs,mozcpp}
      # without a matching source regen (see #400). The marker is
      # a Dependabot notification hook only — Cargo never compiles
      # it, and bumping it does NOT regenerate the bundled
      # `src/parser.c` / `src/scanner.c`. The gate compares the
      # live marker line in each vendored Cargo.toml against
      # `.grammar-marker-baseline.toml`; drift fails. Invokes
      # `python3` directly to match the sibling `snapshot-anchors`
      # / `check-versions` hooks and avoid the `make` dependency.
      - id: grammar-marker-sync
        name: grammar-marker-sync
        language: system
        files: '^(tree-sitter-(mozjs|mozcpp)/Cargo\.toml|\.grammar-marker-baseline\.toml|utils/check-grammar-marker-sync\.py)$'
        entry: python3 utils/check-grammar-marker-sync.py
        pass_filenames: false

      # Self-tests for the grammar-marker-sync gate itself. Runs
      # on edits to either the script or its test file. Kept as a
      # separate hook so the gate hook above remains a one-line
      # invariant check and the tests get their own clear pass/fail
      # in `pre-commit run` output.
      - id: grammar-marker-sync-test
        name: grammar-marker-sync-test
        language: system
        files: '^utils/check-grammar-marker-sync(-test)?\.py$'
        entry: python3 -m unittest -q utils/check-grammar-marker-sync-test.py
        pass_filenames: false

      # Self-tests for the lockstep-version gate. Runs on edits to the
      # script or its test file (the unit tests import the module, so a
      # logic change there must re-run them).
      - id: check-versions-test
        name: check-versions-test
        language: system
        files: '^utils/check-versions(-test)?\.py$'
        entry: python3 -m unittest -q utils/check-versions-test.py
        pass_filenames: false

      # Self-tests for the workspace-exclusion gate. Runs on edits to
      # the script or its test file (the unit tests import the module,
      # so a logic change there must re-run them).
      - id: check-excluded-manifests-test
        name: check-excluded-manifests-test
        language: system
        files: '^utils/check-excluded-manifests(-test)?\.py$'
        entry: python3 -m unittest -q utils/check-excluded-manifests-test.py
        pass_filenames: false

      # Self-tests for the worktree-setup submodule classifier. It is
      # what decides when to run a destructive `git submodule update
      # --force`, so a logic change there re-runs them (#1171).
      - id: worktree-setup-test
        name: worktree-setup-test
        language: system
        files: '^utils/worktree-setup(-test)?\.py$'
        entry: python3 -m unittest -q utils/worktree-setup-test.py
        pass_filenames: false

      # Self-tests for the pre-commit/ci verdict line. gate-status.sh is
      # what stands between a red gate and a log that reads as green, so
      # a logic change there re-runs them (#1172).
      - id: gate-status-test
        name: gate-status-test
        language: system
        files: '^utils/gate-status(-test)?\.sh$'
        entry: bash utils/gate-status-test.sh
        pass_filenames: false

      # Sync-test for check-grammar-crate.py's EXTENSIONS table against
      # src/langs.rs (#869). Re-runs when the script, its test, or the
      # source-of-truth language table changes.
      - id: check-grammar-crate-test
        name: check-grammar-crate-test
        language: system
        files: '^(utils/check-grammar-crate(-test)?\.py|src/langs\.rs)$'
        entry: python3 -m unittest -q utils/check-grammar-crate-test.py
        pass_filenames: false

      # Block enums codegen drift (#405). Runs the codegen into a
      # tempdir and diffs against the checked-in
      # `src/c_langs_macros/*.rs` and `src/languages/language_*.rs`
      # files. Triggered by edits to inputs that actually affect
      # codegen output: the source crate's src/, templates, data
      # files, and Cargo.toml — plus the checked-in artifacts
      # themselves. `enums/tests/`, `enums/target/`, and
      # `enums/Cargo.lock` are intentionally excluded; they
      # do not change codegen output and would force a 30-60s
      # cargo build on every unrelated commit touching them.
      - id: enums-codegen-drift
        name: enums-codegen-drift
        language: system
        files: '^(enums/(src|templates|data)/.+|enums/Cargo\.toml|src/c_langs_macros/[^/]+\.rs|src/languages/language_[^/]+\.rs|utils/check-enums-codegen-drift\.sh)$'
        entry: bash utils/check-enums-codegen-drift.sh
        pass_filenames: false

      # Self-tests for the enums-codegen-drift gate. Runs on edits
      # to either the script or its test file. Kept as a separate
      # hook so the gate hook above stays a one-line invariant
      # check and the tests get their own pass/fail in
      # `pre-commit run` output.
      - id: enums-codegen-drift-test
        name: enums-codegen-drift-test
        language: system
        files: '^utils/check-enums-codegen-drift(-test\.py|\.sh)$'
        entry: python3 -m unittest -q utils/check-enums-codegen-drift-test.py
        pass_filenames: false

      # Catch clap-vs-man-page drift before push. The
      # `.github/workflows/ci.yml` `manpage` job (Regenerate, then
      # `git diff --exit-code -- man/`) is the upstream backstop;
      # this hook makes the same check available locally and via
      # `pre-commit run --all-files`. The hook fails on drift and
      # leaves the regenerated files in the working tree — same
      # side effect CI runs into, accepted because man pages are
      # generated artifacts.
      #
      # The `files:` filter covers every input that can change the
      # generated `.1` output:
      #   - clap definitions in the two CLI crates and xtask itself
      #   - the binary version (which `clap_mangen` writes into
      #     every page's `.TH` header) — propagated via the
      #     lockstep version policy through every owned
      #     Cargo.toml, so we trigger on any of those
      #   - direct edits to `man/*.1`
      # Cargo.lock is intentionally excluded — too noisy for a
      # local hook; the CI `manpage` job catches dep-induced drift.
      - id: manpages
        name: manpages
        language: system
        files: '^(big-code-analysis-cli/(src/.*\.rs|Cargo\.toml)|big-code-analysis-web/(src/.*\.rs|Cargo\.toml)|xtask/(src/.*\.rs|Cargo\.toml)|Cargo\.toml|man/.*\.1)$'
        entry: make manpages-check
        pass_filenames: false

      # Lockstep version invariant — every owned crate and every
      # `=<v>` internal-dep pin must match the workspace version.
      # See RELEASING.md "Lockstep version policy".
      - id: check-versions
        name: check-versions
        language: system
        files: '(Cargo\.toml|/Cargo\.toml|/bindings/rust/README\.md|^README\.md|^STABILITY\.md|big-code-analysis-book/src/library/(quick-start|cargo-features|stability)\.md|big-code-analysis-book/src/recipes/ci\.md|utils/check-versions\.py)$'
        entry: python3 utils/check-versions.py
        pass_filenames: false

      # Workspace-exclusion gate — every crate in the root
      # `[workspace] exclude` array must root its own workspace, or
      # cargo's upward search escapes a nested git worktree and
      # resolves against the main checkout. See #1145.
      - id: check-excluded-manifests
        name: check-excluded-manifests
        language: system
        # `tree-sitter-[a-z]+` missed `tree-sitter-c-sharp/` and
        # `tree-sitter-mozjs2/` — any hyphen or digit in a crate
        # directory took its manifest out of the hook's scope. Match
        # any top-level directory, like the broad `Cargo\.toml`
        # alternation the check-versions hook uses.
        files: '(^Cargo\.toml|^[^/]+/Cargo\.toml|^utils/check-excluded-manifests\.py)$'
        entry: python3 utils/check-excluded-manifests.py
        pass_filenames: false

      # Man-page packaging gate — every man/bca*.1 page (the top-level
      # bca.1 and every bca-*.1 subcommand page) must appear in both
      # the deb and rpm asset lists of its owning crate (bca-web.1 in
      # big-code-analysis-web, bca.1 + the rest in the CLI crate).
      # Guards the #444 bug class. See #446, #873.
      - id: check-manpage-assets
        name: check-manpage-assets
        language: system
        files: '^(man/bca.*\.1|big-code-analysis-cli/Cargo\.toml|big-code-analysis-web/Cargo\.toml|utils/check-manpage-assets\.py)$'
        entry: python3 utils/check-manpage-assets.py
        pass_filenames: false

      # The `enums/` crate is workspace-excluded, so the workspace
      # clippy/test hooks above never touch it. Add a dedicated check
      # so warnings here cannot drift (see #164).
      - id: enums-check
        name: enums-check
        language: system
        files: '^enums/.*\.(rs|toml|lock)$'
        entry: make enums-check
        pass_filenames: false

      # bca self-scan threshold gate (hard tier). Mirrors the
      # `Threshold gate` step in .github/workflows/pages.yml. The
      # hook fails when any function regresses past the thresholds in
      # `bca.toml` minus the `.bca-baseline.toml` ratchet. When you
      # intentionally bump a limit, edit the `[thresholds]` table in
      # `bca.toml` with a why-comment in the same commit; when you
      # intentionally accept new offenders, run
      # `make self-scan-write-baseline` and commit the resulting
      # diff. `files` is a coarse fire-or-not filter: the inputs that
      # can change the gate's verdict — analysed Rust source, the
      # manifest (paths + thresholds + cyclomatic policy + baseline),
      # the baseline itself, and `.bcaignore`. It is deliberately NOT
      # a mirror of `.bcaignore`'s deny-set. The hook runs
      # `pass_filenames: false`, so `make self-scan` performs a full
      # repo scan that already honours `.bcaignore` (the gate's single
      # source of truth, wired via `exclude_from` in `bca.toml`).
      # Firing on a `.rs` edit that `.bcaignore` would exclude (a
      # vendored grammar file, a `*_tests.rs`) therefore yields a
      # correct no-op verdict, never a wrong one — we accept those
      # occasional wasted runs to delete the glob→regex hand-
      # translation that used to live in `exclude:` here and silently
      # drift out of sync with `.bcaignore` (#485).
      - id: bca-self-scan
        name: bca-self-scan
        language: system
        files: '(\.rs$|^bca\.toml$|^\.bca-baseline\.toml$|^\.bcaignore$)'
        entry: make self-scan
        pass_filenames: false

      # bca self-scan threshold gate (soft tier). Scales every
      # threshold in `bca.toml` by `BCA_HEADROOM`
      # (default 0.95) and runs the same baseline-ratcheted check.
      # Fails when a function has crept into the 95-100% band of
      # any limit without being baselined — gives a one-or-two-
      # commit lead time to either refactor or raise the limit
      # before the hard gate trips. Override with
      # `BCA_HEADROOM=0.90 pre-commit run bca-self-scan-headroom`
      # to widen the band.
      # See the `files:` rationale on `bca-self-scan` above: the
      # pattern is a coarse fire-or-not filter, not a mirror of
      # `.bcaignore`. The full `pass_filenames: false` scan already
      # honours `.bcaignore`, so no `exclude:` regex is needed here
      # either (#485).
      - id: bca-self-scan-headroom
        name: bca-self-scan-headroom
        language: system
        files: '(\.rs$|^bca\.toml$|^\.bca-baseline\.toml$|^\.bcaignore$)'
        entry: make self-scan-headroom
        pass_filenames: false

      # Strict rustdoc gate (broken intra-doc links, links into private
      # items, etc.). Wired here in addition to `make pre-commit` /
      # `make ci` so the `pre-commit run --all-files` invocation path
      # honours the same gate — see lesson 21 in
      # docs/development/lessons_learned.md on parity between the three
      # call sites (local make aggregate, pre-commit framework, CI).
      - id: doc-check
        name: doc-check
        language: system
        files: '\.rs$'
        entry: make doc-check
        pass_filenames: false

      # mypy --strict against the bindings crate. Implemented as a
      # `language: system` hook (rather than `pre-commit/mirrors-mypy`)
      # because pre-commit's isolated venv cannot see the project's
      # `maturin develop`'d `_native` extension or the rest of the
      # dev environment — under that isolation, `--strict`'s whole-
      # program analysis is silently meaningless. The system hook runs
      # against the contributor's PATH-resolved `mypy`, same pattern
      # as the clippy/udeps/test hooks above.
      #
      # pyright is intentionally NOT a pre-commit hook: it bundles a
      # Node runtime that pre-commit cannot hermetically isolate and
      # suffers the same isolated-venv problem mypy does. The CI
      # `python-lint` job covers it.
      - id: py-mypy
        name: py-mypy
        language: system
        # Match both `.py` source and `.pyi` stubs — editing
        # `_native.pyi` must also re-run mypy so the stub stays in
        # sync with the Rust-side ABI it describes.
        files: '^big-code-analysis-py/.*\.pyi?$'
        # Use --config-file + absolute-ish paths so the invocation is
        # cross-platform — `bash -c "cd X && ..."` fails on native
        # Windows pre-commit (no bash on cmd/PowerShell PATH).
        entry: mypy
        args:
          - --strict
          - --config-file=big-code-analysis-py/pyproject.toml
          - big-code-analysis-py/python
          - big-code-analysis-py/tests
          - big-code-analysis-py/examples
        pass_filenames: false

default_language_version:
    python: python3
