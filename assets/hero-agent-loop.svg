<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     role="img" aria-labelledby="title desc" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title id="title">big-code-analysis: metrics inside the coding agent's loop</title>
  <desc id="desc">A three-step feedback loop. Step one: a coding agent edits a file and a
    function grows to six levels of nesting. Step two: bca check parses it with tree-sitter and
    compares per-function metrics against the limits in bca.toml — cognitive complexity is 34
    against a limit of 25, while cyclomatic, ABC and nexits stay clear. Step three: bca exits 2 and
    the offender list plus the project's anti-gaming guidance land straight in the model's context.
    A return arrow closes the loop back to step one: the agent simplifies, and the next edit is
    checked again. A trend line shows cognitive complexity for the same function falling from 34,
    over the limit, to 11, under it, across successive edits.</desc>

  <style>
    .ink      { fill: #ffffff; }
    .ink2     { fill: #c3c2b7; }
    .muted    { fill: #898781; }
    .dim      { fill: #75746f; }
    .accent   { fill: #3987e5; }
    .mono     { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
    .kw       { fill: #9085e9; }
    .id       { fill: #c3c2b7; }
    .err      { fill: #e08b8b; }
    .bad      { fill: #d03b3b; }
    .good     { fill: #0ca30c; }
    .hair     { stroke: #ffffff; stroke-opacity: 0.10; stroke-width: 1; }
    .eyebrow  { font-size: 9.5px; letter-spacing: 0.9px; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0.5 1 L9 5 L0.5 9 Z" fill="#3987e5"/>
    </marker>
    <!-- Status glyphs are drawn, not typed: the red/green pair is the one place
         colour alone could carry meaning, so every status mark ships an icon. -->
    <g id="ok"><path d="M-4 0.2 L-1.2 3 L4.4 -3.4" fill="none" stroke="#0ca30c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="no"><path d="M-3.3 -3.3 L3.3 3.3 M3.3 -3.3 L-3.3 3.3" fill="none" stroke="#d03b3b" stroke-width="2.1" stroke-linecap="round"/></g>
  </defs>

  <rect width="1280" height="720" rx="20" fill="#0d0d0d"/>

  <!-- ══ header ══════════════════════════════════════════════════════════ -->
  <g>
    <path d="M75.5 40.4 A15 15 0 1 1 64 35" fill="none" stroke="#3987e5" stroke-width="2.6" stroke-linecap="round" marker-end="url(#ah)"/>
    <g fill="#ffffff">
      <rect x="57.4" y="44" width="3.4" height="13" rx="1.3"/>
      <rect x="62.3" y="48" width="3.4" height="9" rx="1.3"/>
      <rect x="67.2" y="52" width="3.4" height="5" rx="1.3"/>
    </g>

    <text x="92" y="62" class="ink" font-size="27" font-weight="700" letter-spacing="-0.4">big-code-analysis</text>

    <rect x="974" y="36" width="258" height="26" rx="13" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="1103" y="53" class="ink2" font-size="11" text-anchor="middle">23 languages · tree-sitter · no build step</text>

    <text x="48" y="96" class="ink2" font-size="16.5">Agents write a lot of code. Nothing in their loop tells them when a function got too complex to maintain.</text>
    <line x1="48" y1="120" x2="1232" y2="120" class="hair"/>
  </g>

  <!-- ══ step 1 — the agent edits ════════════════════════════════════════ -->
  <g>
    <rect x="48" y="148" width="352" height="302" rx="14" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="68" y="168" width="26" height="26" rx="8" fill="#3987e5" fill-opacity="0.16" stroke="#3987e5" stroke-opacity="0.45"/>
    <text x="81" y="186" font-size="13" font-weight="700" fill="#7fb6f0" text-anchor="middle">1</text>
    <text x="104" y="187" class="ink" font-size="15.5" font-weight="600">The agent edits</text>
    <text x="68" y="214" class="muted" font-size="11.5">a function quietly grows a sixth level of nesting</text>

    <rect x="64" y="230" width="320" height="200" rx="10" fill="#0f0f0e" stroke="#ffffff" stroke-opacity="0.07"/>
    <g class="mono" font-size="10.8">
      <text x="80"  y="254"><tspan class="kw">fn </tspan><tspan class="id">apply_discounts(cart: &amp;Cart) -&gt; Total {</tspan></text>
      <text x="93"  y="273"><tspan class="kw">if </tspan><tspan class="id">cart.is_empty() { </tspan><tspan class="kw">return </tspan><tspan class="id">Total::ZERO }</tspan></text>
      <text x="93"  y="292"><tspan class="kw">for </tspan><tspan class="id">item </tspan><tspan class="kw">in </tspan><tspan class="id">cart.items() {</tspan></text>
      <text x="106" y="311"><tspan class="kw">if </tspan><tspan class="id">item.taxable {</tspan></text>
      <text x="119" y="330"><tspan class="kw">match </tspan><tspan class="id">coupon.kind {</tspan></text>
      <text x="132" y="349"><tspan class="id">Pct </tspan><tspan class="kw">if </tspan><tspan class="id">item.on_sale =&gt; {</tspan></text>
      <text x="145" y="368"><tspan class="kw">while let </tspan><tspan class="id">Some(r) = rules() {</tspan></text>
    </g>
    <rect x="337" y="358" width="7" height="13" fill="#3987e5" fill-opacity="0.85"/>
    <text x="80" y="412" class="dim" font-size="10">nesting depth 6  ·  +62 lines this turn</text>
  </g>

  <path d="M410 299 H452" stroke="#3987e5" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- ══ step 2 — bca measures it ════════════════════════════════════════ -->
  <g>
    <rect x="464" y="148" width="352" height="302" rx="14" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="484" y="168" width="26" height="26" rx="8" fill="#3987e5" fill-opacity="0.16" stroke="#3987e5" stroke-opacity="0.45"/>
    <text x="497" y="186" font-size="13" font-weight="700" fill="#7fb6f0" text-anchor="middle">2</text>
    <text x="520" y="187" class="ink" font-size="15.5" font-weight="600">bca check measures it</text>
    <text x="484" y="214" class="muted" font-size="11.5">tree-sitter parse → per-function metrics</text>

    <g stroke="#898781" stroke-opacity="0.30" stroke-width="1.3">
      <path d="M768 172 L754 190 M768 172 L782 190 M754 190 L746 208 M754 190 L762 208"/>
    </g>
    <g fill="#898781" fill-opacity="0.55">
      <circle cx="768" cy="172" r="3"/><circle cx="754" cy="190" r="3"/><circle cx="782" cy="190" r="3"/>
      <circle cx="746" cy="208" r="3"/><circle cx="762" cy="208" r="3"/>
    </g>

    <rect x="480" y="230" width="320" height="200" rx="10" fill="#0f0f0e" stroke="#ffffff" stroke-opacity="0.07"/>
    <text x="496" y="252" class="dim eyebrow">METRIC</text>
    <text x="784" y="252" class="dim eyebrow" text-anchor="end">VALUE / LIMIT</text>
    <line x1="496" y1="260" x2="784" y2="260" class="hair"/>

    <!-- Each track is the budget; the tick is the limit, so bar length is
         value/limit and only an over-limit bar crosses the tick. -->
    <g>
      <text x="496" y="284" class="mono ink2" font-size="11">cognitive</text>
      <rect x="576" y="272" width="130" height="9" rx="4.5" fill="#2c2c2a"/>
      <rect x="576" y="272" width="125" height="9" rx="4.5" fill="#d03b3b"/>
      <line x1="668" y1="267" x2="668" y2="286" stroke="#a8a69e" stroke-width="1.5"/>
      <text x="760" y="284" class="mono ink" font-size="10.5" text-anchor="end">34 / 25</text>
      <use href="#no" x="774" y="277"/>
    </g>
    <g>
      <text x="496" y="320" class="mono ink2" font-size="11">cyclomatic</text>
      <rect x="576" y="308" width="130" height="9" rx="4.5" fill="#2c2c2a"/>
      <rect x="576" y="308" width="74" height="9" rx="4.5" fill="#0ca30c"/>
      <line x1="668" y1="303" x2="668" y2="322" stroke="#a8a69e" stroke-width="1.5"/>
      <text x="760" y="320" class="mono ink" font-size="10.5" text-anchor="end">12 / 15</text>
      <use href="#ok" x="774" y="313"/>
    </g>
    <g>
      <text x="496" y="356" class="mono ink2" font-size="11">abc</text>
      <rect x="576" y="344" width="130" height="9" rx="4.5" fill="#2c2c2a"/>
      <rect x="576" y="344" width="63" height="9" rx="4.5" fill="#0ca30c"/>
      <line x1="668" y1="339" x2="668" y2="358" stroke="#a8a69e" stroke-width="1.5"/>
      <text x="760" y="356" class="mono ink" font-size="10.5" text-anchor="end">41 / 60</text>
      <use href="#ok" x="774" y="349"/>
    </g>
    <g>
      <text x="496" y="392" class="mono ink2" font-size="11">nexits</text>
      <rect x="576" y="380" width="130" height="9" rx="4.5" fill="#2c2c2a"/>
      <rect x="576" y="380" width="55" height="9" rx="4.5" fill="#0ca30c"/>
      <line x1="668" y1="375" x2="668" y2="394" stroke="#a8a69e" stroke-width="1.5"/>
      <text x="760" y="392" class="mono ink" font-size="10.5" text-anchor="end">3 / 5</text>
      <use href="#ok" x="774" y="385"/>
    </g>
    <text x="496" y="418" class="dim" font-size="10">the tick is the limit from bca.toml — one bar crosses it</text>
  </g>

  <path d="M826 299 H868" stroke="#3987e5" stroke-width="1.8" marker-end="url(#ah)"/>

  <!-- ══ step 3 — the verdict lands in context ═══════════════════════════ -->
  <g>
    <rect x="880" y="148" width="352" height="302" rx="14" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="900" y="168" width="26" height="26" rx="8" fill="#3987e5" fill-opacity="0.16" stroke="#3987e5" stroke-opacity="0.45"/>
    <text x="913" y="186" font-size="13" font-weight="700" fill="#7fb6f0" text-anchor="middle">3</text>
    <text x="936" y="187" class="ink" font-size="15.5" font-weight="600">It lands back in context</text>
    <text x="900" y="214" class="muted" font-size="11.5">PostToolUse hook, the moment the edit lands</text>

    <rect x="896" y="230" width="320" height="200" rx="10" fill="#0f0f0e" stroke="#ffffff" stroke-opacity="0.07"/>
    <g class="mono" font-size="10.5">
      <text x="912" y="256"><tspan class="accent">$ </tspan><tspan class="ink2">bca check src/cart.rs</tspan></text>
      <text x="912" y="274" class="ink2">cart.rs:88-160: apply_discounts:</text>
      <text x="925" y="292"><tspan class="err">cognitive = 34 </tspan><tspan class="dim">(limit 25)</tspan></text>
      <text x="912" y="310" class="dim">--- summary ---</text>
      <text x="912" y="328" class="dim">cart.rs: 1 violation (worst: cognitive)</text>
    </g>
    <line x1="912" y1="346" x2="1200" y2="346" class="hair"/>

    <rect x="912" y="356" width="258" height="25" rx="6" fill="#3987e5" fill-opacity="0.13" stroke="#3987e5" stroke-opacity="0.38"/>
    <text x="925" y="373" font-size="11" fill="#cfe0f7">exit 2 → straight into the model's context</text>

    <rect x="912" y="392" width="2.5" height="32" fill="#3987e5" fill-opacity="0.55"/>
    <text x="924" y="406" class="muted" font-size="10.5" font-style="italic">“Make the code genuinely simpler —</text>
    <text x="924" y="422" class="muted" font-size="10.5" font-style="italic">not the number smaller.”</text>
  </g>

  <!-- ══ the loop closes ═════════════════════════════════════════════════ -->
  <g>
    <circle cx="1056" cy="454" r="3" fill="#3987e5"/>
    <path d="M1056 454 V480 Q1056 492 1044 492 H236 Q224 492 224 480 V458"
          fill="none" stroke="#3987e5" stroke-width="1.8" marker-end="url(#ah)"/>
    <rect x="454" y="479" width="372" height="26" rx="13" fill="#0d0d0d" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="640" y="496" font-size="12" class="ink2" text-anchor="middle"><tspan fill="#ffffff" font-weight="600">the agent simplifies</tspan> · the next edit is checked again</text>
    <line x1="48" y1="532" x2="1232" y2="532" class="hair"/>
  </g>

  <!-- ══ outcome ═════════════════════════════════════════════════════════ -->
  <g>
    <text x="48" y="568" class="ink" font-size="17" font-weight="600">Complexity gets caught where it is cheap</text>
    <text x="48" y="594" class="ink2" font-size="12.5">At the edit that introduced it — not in code review three weeks later.</text>
    <text x="48" y="612" class="ink2" font-size="12.5">The agent gates on exactly the thresholds CI gates on, so it works toward what ships.</text>

    <text x="632" y="566" class="dim" font-size="10.5" text-anchor="end">cognitive · apply_discounts()</text>
    <text x="632" y="594" class="muted" font-size="10" text-anchor="end">limit 25</text>
    <line x1="640" y1="590" x2="1112" y2="590" stroke="#898781" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="4 3"/>

    <g fill="#d03b3b">
      <path d="M648 640 V576 Q648 572 652 572 H680 Q684 572 684 576 V640 Z"/>
      <path d="M708 640 V576 Q708 572 712 572 H740 Q744 572 744 576 V640 Z"/>
      <path d="M768 640 V582 Q768 578 772 578 H800 Q804 578 804 582 V640 Z"/>
      <path d="M828 640 V590 Q828 586 832 586 H860 Q864 586 864 590 V640 Z"/>
    </g>
    <g fill="#0ca30c">
      <path d="M888 640 V596 Q888 592 892 592 H920 Q924 592 924 596 V640 Z"/>
      <path d="M948 640 V608 Q948 604 952 604 H980 Q984 604 984 608 V640 Z"/>
      <path d="M1008 640 V616 Q1008 612 1012 612 H1040 Q1044 612 1044 616 V640 Z"/>
      <path d="M1068 640 V622 Q1068 618 1072 618 H1100 Q1104 618 1104 622 V640 Z"/>
    </g>
    <line x1="640" y1="640" x2="1112" y2="640" stroke="#383835" stroke-width="1"/>

    <text x="666" y="564" class="ink" font-size="12" font-weight="700" text-anchor="middle">34</text>
    <text x="1086" y="610" class="ink" font-size="12" font-weight="700" text-anchor="middle">11</text>

    <use href="#no" x="1136" y="592"/>
    <text x="1148" y="596" class="bad" font-size="9.5" font-weight="600">over limit</text>
    <use href="#ok" x="1136" y="610"/>
    <text x="1148" y="614" class="good" font-size="9.5" font-weight="600">under limit</text>

    <text x="640" y="662" class="dim" font-size="10">successive edits in one session →</text>
  </g>

  <!-- ══ footer ══════════════════════════════════════════════════════════ -->
  <g class="mono dim" font-size="11">
    <text x="48" y="696">dekobon.github.io/big-code-analysis</text>
    <text x="1232" y="696" text-anchor="end">cargo install big-code-analysis-cli</text>
  </g>
</svg>
