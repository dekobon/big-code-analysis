# cargo-mutants settings shared by local runs and the scheduled
# `.github/workflows/mutation-test.yml` job. Read automatically from the
# workspace root. `output` is a config key from cargo-mutants 25.0, and
# the parser rejects unknown keys, so anything older fails loudly on
# this file; 26.0 made the deterministic, unshuffled order the default,
# so a 25.x release reads this file and merely runs shuffled. See
# `docs/development/mutation_testing.md`.
#
# `--package` and `--in-place` have no config-file key and stay on the
# command line. `--file` has one, `examine_globs`, and it is
# deliberately absent: since cargo-mutants 27.0 the command line's
# `--file` is unioned with it, so listing the CI surface here would
# silently widen a single-file local run to the whole set.

# Floor on the auto-detected per-mutant test timeout, in seconds, so a
# slow runner does not read a long-running suite as a hung mutant.
minimum_test_timeout = 120

# Results land in `target/mutants/mutants.out/` rather than an
# untracked `mutants.out/` at the repository root.
output = "target/mutants"

# By default a mutant is judged only by its own package's tests. The
# behaviour of `big-code-analysis-ast`'s checker and getter is pinned
# almost entirely by the root crate's metric tests, so every mutant
# runs both suites.
test_package = ["big-code-analysis", "big-code-analysis-ast"]

# Test modules are not the subject. cargo-mutants skips a module
# declared under a bare `#[cfg(test)]`, and reads
# `#[cfg(all(test, any(feature = …)))]` as ordinary code: the two
# `derived_parity_tests.rs` suites are gated that way, and their helpers
# were being mutated as if they were classifiers. An exclusion, unlike
# `examine_globs`, cannot widen a single-file local run.
exclude_globs = ["**/*_tests.rs"]

# Mutants no run tests. The comment above an entry says which of five
# kinds it is, and why:
#
# - equivalent: identical on every reachable input, panics and side
#   effects included;
# - unreachable: the code runs for no language;
# - non-terminating, or allocating without bound, under mutation;
# - same output, different work: no metric moves, and the entry names
#   the work the mutant skips or adds, which a test-support counter can
#   observe;
# - separated only by source the language rejects, where the comment at
#   the site says the branch is unpinned on purpose.
#
# An entry that rests on evidence short of a proof says what the
# evidence covers and what it does not.
#
# A pattern omits the line and column, which move with any edit above
# the site, and is anchored at both ends so it matches that mutant
# alone. Compare `cargo mutants --list --no-config` with
# `cargo mutants --list` after adding one: the difference must be
# exactly the mutants named. Where another site in the same function
# shares the description, the entry keeps the column to tell the two
# apart and says so; where the column is shared too, it keeps the line
# and has to be checked again whenever that line moves. A
# `delete field …` mutant cannot be listed here at all: cargo-mutants
# 27.1.0 applies no name filter to those.
exclude_re = [
  # Equivalent. With `<=` the downward branch is also taken when `word`
  # equals `first_word`: `below` is 0, the splice inserts nothing and
  # `first_word` is assigned its own value. The branch it displaces is
  # the upward one, which does nothing there either, since `words` is
  # non-empty and `word - first_word >= words.len()` reads `0 >= len`.
  '^src/metrics/loc/line_set\.rs:\d+:\d+: replace < with <= in LineSet::reserve$',
  # Equivalent. The deleted arm answers `true`, and so does the `_`
  # arm the three kinds then fall to: `is_assignment` is false for a
  # rescue modifier, so the guarded arm between them does not take them.
  '^src/metrics/npa/ruby_body\.rs:\d+:\d+: delete match arm RescueModifier \| RescueModifier2 \| RescueModifier3 in is_statement_of$',
  # Equivalent. With `&&` the class body's frame and an argument frame
  # are read through `is_statement_of`, whose answer for a parent that
  # is a class body or an argument list is `child.is_named()`, the test the
  # original applies to those two frames itself. No frame is both.
  '''^src/metrics/npa/ruby_body\.rs:\d+:\d+: replace \|\| with && in RubyBodyState<'a, 'chain>::read_body$''',
  # Equivalent while tree-sitter-kotlin's `property_declaration` holds
  # exactly one of `variable_declaration` and
  # `multi_variable_declaration`: without the arm a single binding sums
  # to 0, and the `.max(1)` on the sum makes it 1 again.
  '^src/metrics/npa/kotlin\.rs:\d+:\d+: delete match arm VariableDeclaration in kotlin_count_property_attrs$',
  # Equivalent. `<=` differs only when the last row starts at the end
  # of the file, where the row is empty: its shape is blank, it pushes
  # one `None` and leaves nothing pending, as the original does.
  '^src/metrics/loc/continuation\.rs:\d+:\d+: replace < with <= in BareRowIndex::build$',
  # Equivalent. The branch is reached only when `after && diff == 0` is
  # false, so with `after` true `diff` is positive and both spellings
  # read `after`.
  '^src/metrics/loc/shared\.rs:\d+:\d+: replace > with >= in add_cloc_lines$',
  # The next two rest on one fact about the grammars whose bare rows
  # reach the gap scan (Bash, Tcl, iRules, Ruby, Elixir, Python; the C
  # family answers every row from its index): `comment` is a childless
  # terminal that ends only before a newline, a NUL or the end of the
  # file. Read from each pinned grammar's lexer, and re-derived on a
  # bump. A differential run over close to a million generated sources,
  # malformed ones included, showed no output difference for any of them.
  #
  # `holder_of`: where the mutant answers a node and the original none,
  # that node has children, or is one no comment can end against, so
  # `in_comment` reads false either way. `<=` is both boundary tests.
  '''^src/metrics/loc/shared\.rs:\d+:\d+: replace && with \|\| in GapScan<'_, 'a>::holder_of$''',
  '''^src/metrics/loc/shared\.rs:\d+:\d+: replace < with <= in GapScan<'_, 'a>::holder_of$''',
  # Non-terminating under mutation. With `||` a node that is not a
  # comment short-circuits past `goto_first_child`, and the `continue`
  # reads the same node again; the root is never a comment, so every
  # `BareRowIndex::build` spins on its first step.
  '^src/metrics/loc/continuation\.rs:\d+:\d+: replace && with \|\| in comment_spans$',
  # Non-terminating under mutation. `past_line_padding` re-reads its
  # position through this function; answering 0 for a source that opens
  # with a backslash and a newline sends it back to the start for ever.
  '^src/metrics/loc/shared\.rs:\d+:\d+: replace past_horizontal_space -> usize with 0$',
  # Equivalent. `PYTHON_COMMENTS` is a constant whose `continued` is
  # false, so the guard reads false for every input before the mutant
  # says so.
  '^src/metrics/loc/python\.rs:\d+:\d+: replace match guard in_comment && PYTHON_COMMENTS\.continued with false in classify_python_run$',
  # Equivalent. Each differs only when the two values compared are
  # equal, and then keeps or assigns the other of two equal values. The
  # one pair that is equal and distinguishable is `+0.0` and `-0.0`,
  # and no population folds a negative zero: a `usize` has none, and
  # every `f64` folded starts at 1 and only grows.
  '^src/metrics/mod\.rs:\d+:\d+: replace < with <= in FunctionPopulation<T>::(fold|merge)$',
  '^src/metrics/mod\.rs:\d+:\d+: replace > with >= in FunctionPopulation<T>::(fold|merge)$',
  # Equivalent while the pinned Groovy and Ruby grammars give the
  # `condition`, `consequence` and `alternative` fields to no kind but
  # the ternary and the branch, guard and loop kinds an earlier arm of
  # the same match has already taken. The mutant hands every node that
  # reaches this arm to the ternary walk, which reads those three fields
  # and does nothing when all are absent; an `ERROR` node has no fields.
  # Re-derive on a grammar bump, and if a `Branch` or `Guard` row there
  # gains a gate.
  '^src/metrics/abc/groovy\.rs:\d+:\d+: replace match guard ternary::owns_kind\(kind, node, code, ancestors\) with true in groovy_walk_for_conditions$',
  '^src/metrics/abc/ruby\.rs:\d+:\d+: replace match guard ternary::owns_kind\(kind, node, code, ancestors\) with true in <impl Abc for RubyCode>::compute$',
  # Equivalent. The body forwards to the language's `opens_space`,
  # which answers `SpaceKind::Unknown` unless a row's owner carries
  # `opens` or `opens_by`. Neither the Ccomment nor the Preproc table has
  # one, and `SpaceKind::default()` is `Unknown`.
  '^big-code-analysis-ast/src/getter/(ccomment|preproc)\.rs:\d+:\d+: replace <impl Getter for (Ccomment|Preproc)Code>::get_space_kind_with_code -> SpaceKind with Default::default\(\)$',
  # Equivalent. The outer loop's extra pass has `i == a.len()`, so the
  # inner loop, the only place that indexes, starts past the end and
  # does not run. The inner loop's own `<` is at column 17 and is live:
  # the column tells the two apart.
  '^big-code-analysis-ast/src/roles/mod\.rs:\d+:13: replace < with <= in kinds_repeat$',
  # Unreachable. The helper's one caller reaches it only where
  # `kotlin_is_short_interp_name` holds for the same bytes, which needs
  # a leading identifier of at least one byte, so `prefix_len` is never
  # 0 here and `>` and `>=` agree.
  '''^big-code-analysis-ast/src/getter/kotlin\.rs:\d+:\d+: replace > with >= in kotlin_short_interp_operand_bytes$''',
  # Unreachable. Every `impl Checker for` in `checker/` defines these
  # three itself, through `impl_comment_from_rows!` or
  # `impl_doc_comment_rows_in_bodies!` and through
  # `impl_row_predicates!`, so the trait's default bodies run for no
  # language. The only types that inherit them are two test probes in
  # `cyclomatic.rs`, which call no `Checker` method. A language added
  # without the macros would make them live.
  '^big-code-analysis-ast/src/checker\.rs:\d+:\d+: replace Checker::(is_comment|is_call|is_string) -> bool with true$',
  # Equivalent. Both bodies read a role table in which `FuncOpener` and
  # `Container` are `absent`, so each already answers `false` for every
  # node of a Ccomment or Preproc tree.
  '^big-code-analysis-ast/src/checker/(ccomment|preproc)\.rs:\d+:\d+: replace <impl Checker for (Ccomment|Preproc)Code>::(is_func_space_with_code|is_func_with_code) -> bool with false$',
  # Unreachable. `count_args` in `nargs.rs` is the one caller, and no
  # language that inherits the default reaches it: C#, Go, Lua, Tcl and
  # iRules count their parameters themselves, Bash has no `parameters`
  # field for the default `NArgs::compute` to find, and Ccomment and
  # Preproc open no function.
  '^big-code-analysis-ast/src/checker\.rs:\d+:\d+: replace Checker::is_non_arg -> bool with true$',
  # Same output, less work. With the guard gone every
  # `parenthesized_expression` takes the arm that credits nothing, and
  # its row is credited by the expression's own `(`, the next node the
  # walk reads, through the same catch-all; both productions of the kind
  # in tree-sitter-python 0.25.0 open with that token. The mutant makes
  # one memoised fold probe fewer per such expression. The same guard at
  # column 32 is live; the column tells the two apart.
  '^src/metrics/loc/python\.rs:\d+:40: replace match guard python_is_bare_string_parenthesis\(node, ancestors\) with true in <impl Loc for PythonCode>::compute$',
  # Same output, less work. tree-sitter-go 0.25.0 derives a function or
  # method declaration only at the top level, so its ancestors are the
  # `source_file` and, in recovery, an `ERROR`: the arm's resets change
  # nothing there. The mutant skips the arm's ancestor fold probe.
  '^src/metrics/cognitive/go\.rs:\d+:\d+: replace match guard func_opener::is_callable_kind\(kind, node, code, ancestors\) with false in <impl Cognitive for GoCode>::compute$',
  # Same output, more work, both `&&` of the function. PHP's `Member`
  # row owns `property_declaration` and the two `const_declaration` ids
  # with no gate, so `||` only admits members of the other kind into
  # each filter, and those hold no `property_element` (the class arm)
  # and no `const_element` (the interface arm) to count. The mutant
  # scans the children of each member it admits.
  '^src/metrics/npa/php\.rs:\d+:\d+: replace && with \|\| in <impl Npa for PhpCode>::compute$',
  # Separated only by source C# rejects. With the guard gone the peel
  # also takes `x++` and `x--`, which no boolean slot holds in a program
  # that compiles. The comment above `csharp_wrapper_operand` says the
  # exclusion is unpinned on purpose.
  '^src/metrics/abc/csharp\.rs:\d+:\d+: replace match guard node\.is_child\(BANG as u16\) with true in csharp_wrapper_operand$',
  # Separated only by source Groovy rejects. The grammar spells `super`
  # as a token only in a `wildcard` bound, so the operand arm is reached
  # through recovery alone. The comment at the arm says it is untested
  # on purpose.
  '^big-code-analysis-ast/src/getter/groovy\.rs:\d+:\d+: replace match guard ancestors\.parent_has_kind\(node, Wildcard as u16\) with true in <impl Getter for GroovyCode>::get_op_type$',
  '^big-code-analysis-ast/src/getter/groovy\.rs:\d+:\d+: delete match arm Super in <impl Getter for GroovyCode>::get_op_type$',
  # Equivalent on the evidence, not proved. In a modifier's condition
  # tree-sitter-perl 1.1.2 parses a non-empty `(X)` as `arguments >
  # array`; only the empty `()` becomes a `parenthesized_argument`, and
  # that has no operand with or without the arm. About 13 000 generated
  # sources, most of them damaged, showed no `parenthesized_argument`
  # with a child under a modifier. The parse table was not read.
  '^src/metrics/abc/perl\.rs:\d+:\d+: delete match arm P::ParenthesizedArgument in perl_wrapper_operand$',
  # Equivalent while tree-sitter-perl gives the `condition` field to
  # the thirteen kinds it does at 1.1.2. Both arms read that field and
  # count nothing when it is absent, and each of the thirteen is taken
  # by one of the two or by an earlier arm of the same match: the
  # `elsif` clause and the ternary earlier, a `require_statement` by
  # the first arm exactly where it has the field (#1889), and the
  # `when` modifier by the second, whose body is the first's. So the
  # first mutant takes the `when` modifier early, with the same body,
  # and every other node either mutant adds to its arm has no
  # `condition`; an `ERROR` node has no fields. The cost is a field
  # lookup on every node that reaches the arm.
  # `every_kind_with_a_condition_field_is_listed_by_a_row` fails when a
  # grammar bump adds a kind: re-derive then, and when an arm of the
  # match is reordered or one of these rows gains a gate.
  '^src/metrics/abc/perl\.rs:\d+:\d+: replace match guard branch::owns_kind\(kind, node, code, ancestors\) \|\| matches!\(.*\) with true in <impl Abc for PerlCode>::compute$',
  '^src/metrics/abc/perl\.rs:\d+:\d+: replace match guard case_arm::owns_kind\(kind, node, code, ancestors\) with true in <impl Abc for PerlCode>::compute$',
  # Equivalent for every production, not proved for recovery trees.
  # tree-sitter-rust 0.24.2 places a `const_item` or `static_item` only
  # in a `block`, a `declaration_list` or the `source_file`, and only a
  # `declaration_list` is a direct child of an `impl_item` or a
  # `trait_item`, so once the grandparent matches the guard on the
  # parent is true. An `ERROR` between the two would separate the
  # mutant; a handful of damaged sources built none. Both arms.
  '^src/metrics/npa/rust\.rs:\d+:\d+: replace match guard matches!\(parent\.kind_id\(\)\.into\(\), DeclarationList\) with true in rust_count_assoc_const$',
  # Equivalent while Rust's `Comment` and `DocComment` rows list the
  # same kinds: `lists_kind` reads no gate, so the two calls are one
  # function of the kind and `&&` between them reads as `||`. The `||`
  # one line above has the same name and the same column and is live,
  # so this entry keeps the line. Check it whenever that line moves: a
  # stale line stops excluding this mutant, and a line one off excludes
  # the live one.
  '^big-code-analysis-ast/src/checker\.rs:1105:9: replace \|\| with && in rust_attribute_run_member$',
  # Allocates without bound under mutation. With `*` a set's last word
  # is its offset times its length, so `union_with` reserves that far
  # and every merge up a space tree multiplies the span again. The
  # suite does notice: several hundred tests fail on the wrong rows.
  # But a nested fixture then asks for a span of gigabytes, and on a
  # hosted runner the test binary stalls past the timeout before it can
  # report (run 43437925608: 168 GB requested, judged a timeout; run
  # 43278927651 judged the same mutant caught).
  '^src/metrics/loc/line_set\.rs:\d+:\d+: replace \+ with \* in LineSet::last_word$',
  # Non-terminating under mutation. The loop then breaks when
  # `goto_next_sibling` succeeds and repeats when it fails, so a list
  # with one child is visited forever. Its one caller walks the values
  # of a Go `return`, so every Go ABC test that returns a single value
  # hangs, and no added test can make that suite finish.
  '^src/metrics/abc\.rs:\d+:\d+: delete ! in for_each_named_child$',
]
