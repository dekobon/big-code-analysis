# cargo-mutants settings shared by local runs and the scheduled
# `.github/workflows/mutation-test.yml` job. Read automatically from the
# workspace root. `output` is a config key from cargo-mutants 25.0, and
# the parser rejects unknown keys, so anything older fails loudly on
# this file; 26.0 made the deterministic, unshuffled order the default,
# so a 25.x release reads this file and merely runs shuffled. See
# `docs/development/mutation_testing.md`.
#
# `--package` and `--in-place` have no config-file key and stay on the
# command line. `--file` has one, `examine_globs`, and it is
# deliberately absent: since cargo-mutants 27.0 the command line's
# `--file` is unioned with it, so listing the CI surface here would
# silently widen a single-file local run to the whole set.

# Floor on the auto-detected per-mutant test timeout, in seconds, so a
# slow runner does not read a long-running suite as a hung mutant.
minimum_test_timeout = 120

# Results land in `target/mutants/mutants.out/` rather than an
# untracked `mutants.out/` at the repository root.
output = "target/mutants"

# By default a mutant is judged only by its own package's tests. The
# behaviour of `big-code-analysis-ast`'s checker and getter is pinned
# almost entirely by the root crate's metric tests, so every mutant
# runs both suites.
test_package = ["big-code-analysis", "big-code-analysis-ast"]

# Test modules are not the subject. cargo-mutants skips a module
# declared under a bare `#[cfg(test)]`, and reads
# `#[cfg(all(test, any(feature = …)))]` as ordinary code: the two
# `derived_parity_tests.rs` suites are gated that way, and their helpers
# were being mutated as if they were classifiers. An exclusion, unlike
# `examine_globs`, cannot widen a single-file local run.
exclude_globs = ["**/*_tests.rs"]

# Mutants no run tests. Each entry is one mutant shown to behave
# identically on every reachable input, panics and side effects
# included, or one that never terminates; the reason sits above it. A
# pattern omits the line and column, which move with any edit above the
# site, and is anchored at both ends so it matches that mutant alone.
# Compare `cargo mutants --list --no-config` with `cargo mutants --list`
# after adding one: the difference must be exactly the mutants named.
# Where another site in the same function shares the description, the
# entry keeps the column to tell the two apart and says so. A
# `delete field …` mutant cannot be listed here at all: cargo-mutants
# 27.1.0 applies no name filter to those.
exclude_re = [
  # Equivalent. With `<=` the downward branch is also taken when `word`
  # equals `first_word`: `below` is 0, the splice inserts nothing and
  # `first_word` is assigned its own value. The branch it displaces is
  # the upward one, which does nothing there either, since `words` is
  # non-empty and `word - first_word >= words.len()` reads `0 >= len`.
  '^src/metrics/loc/line_set\.rs:\d+:\d+: replace < with <= in LineSet::reserve$',
  # Equivalent. The deleted arm answers `true`, and so does the `_`
  # arm the three kinds then fall to: `is_assignment` is false for a
  # rescue modifier, so the guarded arm between them does not take them.
  '^src/metrics/npa/ruby_body\.rs:\d+:\d+: delete match arm RescueModifier \| RescueModifier2 \| RescueModifier3 in is_statement_of$',
  # Equivalent. With `&&` the class body's frame and an argument frame
  # are read through `is_statement_of`, whose answer for a parent that
  # is a class body or a `call` is `child.is_named()`, the test the
  # original applies to those two frames itself. No frame is both.
  '''^src/metrics/npa/ruby_body\.rs:\d+:\d+: replace \|\| with && in RubyBodyState<'a, 'chain>::read_body$''',
  # Equivalent while tree-sitter-kotlin's `property_declaration` holds
  # exactly one of `variable_declaration` and
  # `multi_variable_declaration`: without the arm a single binding sums
  # to 0, and the `.max(1)` on the sum makes it 1 again.
  '^src/metrics/npa/kotlin\.rs:\d+:\d+: delete match arm VariableDeclaration in kotlin_count_property_attrs$',
  # Equivalent, both `&&` of the function. PHP's `Member` row owns
  # `property_declaration` and the two `const_declaration` ids with no
  # gate, so `||` only admits members of the other kind into each
  # filter, and those hold no `property_element` (the class arm) and no
  # `const_element` (the interface arm) to count.
  '^src/metrics/npa/php\.rs:\d+:\d+: replace && with \|\| in <impl Npa for PhpCode>::compute$',
  # Equivalent while tree-sitter-rust places a `const_item` or
  # `static_item` only in a `block`, a `declaration_list` or the
  # `source_file`: of those, only a `declaration_list` is a direct child
  # of an `impl_item` or a `trait_item`, so once the grandparent matches
  # the guard on the parent is true. Both arms of the function.
  '^src/metrics/npa/rust\.rs:\d+:\d+: replace match guard matches!\(parent\.kind_id\(\)\.into\(\), DeclarationList\) with true in rust_count_assoc_const$',
  # Equivalent. `<=` differs only when the last row starts at the end
  # of the file, where the row is empty: its shape is blank, it pushes
  # one `None` and leaves nothing pending, as the original does.
  '^src/metrics/loc/continuation\.rs:\d+:\d+: replace < with <= in BareRowIndex::build$',
  # Equivalent. The branch is reached only when `after && diff == 0` is
  # false, so with `after` true `diff` is positive and both spellings
  # read `after`.
  '^src/metrics/loc/shared\.rs:\d+:\d+: replace > with >= in add_cloc_lines$',
  # The next five rest on one fact about the grammars whose bare rows
  # reach the gap scan (Bash, Tcl, iRules, Ruby, Elixir, Python; the C
  # family answers every row from its index): `comment` is a childless
  # terminal that ends only before a newline, a NUL or the end of the
  # file. Read from each pinned grammar's lexer, and re-derived on a
  # bump. A differential run over close to a million generated sources,
  # malformed ones included, showed no output difference for any of them.
  #
  # `holder_of`: where the mutant answers a node and the original none,
  # that node has children, or is one no comment can end against, so
  # `in_comment` reads false either way. `<=` is both boundary tests.
  '''^src/metrics/loc/shared\.rs:\d+:\d+: replace && with \|\| in GapScan<'_, 'a>::holder_of$''',
  '''^src/metrics/loc/shared\.rs:\d+:\d+: replace < with <= in GapScan<'_, 'a>::holder_of$''',
  # The sibling step of `only_comments_after` runs only for a comment a
  # NUL cuts short. No comment starts at a NUL, so its guard is never
  # true and the sibling list feeding it is never read; the NUL is a
  # leaf of its own, so a next sibling starts exactly at `after`.
  # `opens_comment_only_line` has a second, live `==` at column 33; the
  # column is what tells this one from it.
  '^src/metrics/loc/shared\.rs:\d+:37: replace == with != in opens_comment_only_line$',
  '^src/metrics/loc/shared\.rs:\d+:\d+: replace match guard sibling\.start_byte\(\) == after && comments\.lists\(sibling\) with false in only_comments_after$',
  '^src/metrics/loc/shared\.rs:\d+:\d+: replace == with != in only_comments_after$',
  # Non-terminating under mutation. With `||` a node that is not a
  # comment short-circuits past `goto_first_child`, and the `continue`
  # reads the same node again; the root is never a comment, so every
  # `BareRowIndex::build` spins on its first step.
  '^src/metrics/loc/continuation\.rs:\d+:\d+: replace && with \|\| in comment_spans$',
  # Non-terminating under mutation. `past_line_padding` re-reads its
  # position through this function; answering 0 for a source that opens
  # with a backslash and a newline sends it back to the start for ever.
  '^src/metrics/loc/shared\.rs:\d+:\d+: replace past_horizontal_space -> usize with 0$',
  # Equivalent. `PYTHON_COMMENTS` is a constant whose `continued` is
  # false, so the guard reads false for every input before the mutant
  # says so.
  '^src/metrics/loc/python\.rs:\d+:\d+: replace match guard in_comment && PYTHON_COMMENTS\.continued with false in classify_python_run$',
  # Equivalent. Each differs only when the two values compared are
  # equal, and then keeps or assigns the other of two equal values. The
  # one pair that is equal and distinguishable is `+0.0` and `-0.0`,
  # and no population folds a negative zero: a `usize` has none, and
  # every `f64` folded starts at 1 and only grows.
  '^src/metrics/mod\.rs:\d+:\d+: replace < with <= in FunctionPopulation<T>::(fold|merge)$',
  '^src/metrics/mod\.rs:\d+:\d+: replace > with >= in FunctionPopulation<T>::(fold|merge)$',
  # Non-terminating under mutation. The loop then breaks when
  # `goto_next_sibling` succeeds and repeats when it fails, so a list
  # with one child is visited forever. Its one caller walks the values
  # of a Go `return`, so every Go ABC test that returns a single value
  # hangs, and no added test can make that suite finish.
  '^src/metrics/abc\.rs:\d+:\d+: delete ! in for_each_named_child$',
]
