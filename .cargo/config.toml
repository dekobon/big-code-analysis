[alias]
# There is deliberately no `mutants` alias here. cargo resolves the
# first word of an alias expansion as an alias again before falling
# back to an external subcommand, so `mutants = "mutants …"` is
# rejected as recursive (every cargo since 1.56; #1710). The shared
# cargo-mutants settings live in `mutants.toml` beside this file.
#
# `cargo xtask` regenerates man pages under `man/` from the live clap
# definitions of `bca` and `bca-web`. CI gates committed pages against
# its output (see `.github/workflows/ci.yml` job `manpage`).
xtask = "run --package xtask --"
